# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: Beomsu Koh
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: google
    tagId: G-P07C416MPF
  locale: ko-KR
  baseUrl: beomsukoh.com
  ignorePatterns:
    - .git
    - .gitignore
    - .obsidian
    - "**/*.pdf"
    - "**/*.canvas"
    - "**/private/*"
    - .smart-env
    - 50. Calendar
    - 70. Settings
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Inter
      body: Inter
      code: IBM Plex Mono
    colors:
      lightMode:
        light: "#ffffff"
        lightgray: "#e6e6e6"
        gray: "#737373"
        darkgray: "#0f0f0f"
        dark: "#0f0f0f"
        secondary: "#a52142"
        tertiary: "#c75b75"
        highlight: "rgba(165, 33, 66, 0.08)"
        textHighlight: "#fff23688"
      darkMode:
        light: "#262626"
        lightgray: "#353535"
        gray: "#8c8c8c"
        darkgray: "#d1d1d1"
        dark: "#d1d1d1"
        secondary: "#c75b75"
        tertiary: "#a52142"
        highlight: "rgba(165, 33, 66, 0.12)"
        textHighlight: "#b3aa0288"
  links:
    markdownLinkResolution: shortest
  contentIndex:
    enableSiteMap: true
    enableRSS: true
plugins:
  - source: ./plugins/legacy-frontmatter-dates
    enabled: true
    order: 5
  - source: ./plugins/permalink-slug
    enabled: true
    order: 7
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: false
    order: 6
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: created
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  # Mermaid fences render with Pele (released in obsidian-flavored-markdown 2.3)
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
      diagramRenderer: pele
    order: 40
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 30
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
      condition: has-toc
      display: desktop-only
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/unlisted-pages"
    enabled: true
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: ./plugins/graph-landing
    enabled: true
    options:
      landingSlugs: [index]
      expandHops: 1
      tagCooccurrence:
        maxTagsPerNote: 6
        maxEdges: 5000
      renderMode: "3d"
      layout:
        freezeAfterWarmup: true
        incrementalWarmup: true
      interaction:
        incrementalRepaint: true
      lod:
        labelDistance: 800
        fog: true
        linkResolution: 3
        shareLinkResources: true
      music:
        tracks:
          - title: "EVERYTHING"
            artist: "Paikon's Piano Cover"
            url: "https://www.youtube.com/watch?v=erKAm7HRw3c&list=RDerKAm7HRw3c&start_radio=1"
          - title: "Ambient Constellation"
            url: "https://www.youtube.com/watch?v=o6HpCFhNcnQ"
      hero:
        eyebrow: "Beomsu Koh"
        title: "기술은 의도를\n증폭한다."
        titleEmphasis: "의도"
        lede: "사람들이 원치 않게 빼앗기는 인지 자원을 지키는 기술을 만듭니다. 도구가 무엇을 할 수 있는지보다 누구의 의도를 키우는지가 중요합니다."
        actions:
          - label: "소개"
            href: "/about"
            accent: true
          - label: "블로그"
            href: "/writing"
        fallbackLanguage: en
        translations:
          en:
            actions:
              - label: "About"
                href: "/about"
                accent: true
              - label: "Blog"
                href: "/writing"
            title: "Technology\namplifies intent."
            titleEmphasis: "intent"
            lede:
              "I build technology that protects the attention people never meant to give away. What matters is not what a tool
              can do, but whose intent it amplifies."
      profile:
        sections:
          - id: now
            kicker: "What I do"
            title: "에이전트와 함께 제품을 개발하고 운영합니다."
            image:
              src: "/static/home/beomsu-thumbs-up.jpg"
              alt: "바다가 보이는 절벽 위 잔디밭에서 엄지를 들어 보이며 웃는 고범수"
              width: 618
              height: 824
            lede: "AI 엔지니어 고범수입니다. 에이전트 주도 개발 방식으로 제품을 개발하고 운영하고 있습니다. Obsidian과 개인 지식 관리 도구를 오픈소스로 공개해 관리하고 있으며, 그 과정에서 얻은 경험을 대학 강의와 워크숍에서 공유하고 있습니다."
            stats:
              - value: "7"
                label: "Obsidian plugins"
                note: "공식 커뮤니티 플러그인으로 등록해 직접 관리합니다."
              - value: "19,153"
                label: "Downloads"
                note: "플러그인 7개의 누적 다운로드 수입니다. GitHub 스타는 총 99개입니다. 2026년 11월 24일 기준."
              - value: "73"
                label: "Agent skills"
                note: "craft-skills 48개와 secondbrain-skills 25개를 공개했습니다."
              - value: "11"
                label: "Upstage collaborations"
                note: "2026년에 Upstage와 함께한 교육, 콘텐츠, 행사입니다."
          - id: path
            kicker: "Path"
            title: "지금까지 걸어온 길"
            lede: "네트워크 연구실에서 출발해 소프트웨어 공학을 연구했으며, 현재는 에이전트로 제품을 개발하고 교육 활동을 병행하고 있습니다."
            timeline:
              - period: "2018.03 – 2024.08"
                title: "B.Eng. in Software Engineering"
                org: "전남대학교"
                body: "2022년 11월 정보처리기사를 취득했습니다."
              - period: "2020.08 – 2022.04"
                title: "군 복무"
                org: "해양경찰"
              - period: "2022.03 – 2024.06"
                title: "Undergraduate Researcher"
                org: "Advanced Network Lab, 전남대학교"
                body: "데이터통신·컴퓨터네트워크 과목 조교(2023.03 – 2024.06). NET 챌린지 캠프 시즌 9 은상(2022.12, 오케스트라이브 팀 리드)."
              - period: "2023.07 – 2023.08"
                title: "Summer Intern"
                org: "한국에너지공과대학교(KENTECH)"
              - period: "2023.08 – 2023.11"
                title: "축팅 — Backend Tech Lead"
                org: "카카오 테크 캠퍼스 1기"
                body: "Spring·Redis·MariaDB를 Kubernetes에 배포했고, 종합 우수 조로 선정됐습니다."
                href: "https://github.com/Step3-kakao-tech-campus/Team14_BE"
              - period: "2024.09 – 2026.01"
                title: "MSc Advanced Computer Science — Distinction"
                org: "University of Sheffield"
                body:
                  "International PGT Merit Scholarship. 뒤엉킨 코드 커밋 연구를 제1저자로 진행했고, Net Zero Data Challenge 2025에서 Most Impactful
                  Solution을 받았습니다."
              - period: "2024.09 –"
                title: "Obsidian Plugin 구현 및 개발"
                org: "오픈소스"
                href: "#open-source"
                body: "Metadata Auto Classifier를 시작으로 공식 커뮤니티 플러그인 7개를 관리합니다."
              - period: "2026"
                title: "Upstage AI Ambassador 2기\u00A0·\u00A02.5기 — 우수 앰배서더"
                org: "Upstage"
                body: "2026년 5월 우수 앰배서더로 선정되었습니다. 전남대 × Upstage Skillthon을 직접 제안해 개최했으며, 47명 13팀이 참가했습니다."
              - period: "2026.06 – 2026.10"
                title: "SeeON 실시간 낙상 감지 — Business Partner, Head of Technical Development (CTO role)"
                org: "Senior AI Lab"
              - period: "2026.06 – 2026.08"
                title: "KREN AI Ops — Freelance PM & Developer"
                org: "Freelance · 고객사 KREN"
              - period: "2026.07 – 현재"
                title: "OSS Hub — Developer & PM"
                org: "전남대학교 SW중심대학사업단"
                href: "https://jnu-oss-hub.com/"
          - id: work
            nav: "작업"
            kicker: "Work"
            title: "현장에서 돌아가게 만든 것"
            lede: "제품 개발과 Freelance 프로젝트 모두 구현에 그치지 않고 실제 환경에서 운영되는 것까지 확인합니다."
            groups:
              - label: "제품"
                cards:
                  - title: "SeeON"
                    body: "실시간 낙상 감지 시스템. DeepStream·TensorRT로 RTX 5070 Ti 한 장에서 실제 카메라 13대를 각 29.97fps, 합계 389.6fps로 처리했습니다."
                    meta: "Senior AI Lab · 2026.06 – 2026.10"
                  - title: "OSS Hub"
                    body: "학생 오픈소스 이력을 추적하는 플랫폼. 기획부터 운영 배포까지 개발과 PM을 함께 맡고 있습니다."
                    href: "https://jnu-oss-hub.com/"
                    meta: "전남대 SW중심대학사업단 · 2026.07 –"
              - label: "Freelance"
                cards:
                  - title: "KREN AI Ops"
                    body: "KREN의 네트워크 운영에 에이전트를 적용한 Freelance 프로젝트입니다(프로젝트명 SICHIMI AI Ops). PM과 개발을 함께 맡아 GitOps 중심이던 운영을 Hermes 에이전트 팀 운영으로 옮겼습니다. 에이전트 프로필 12개를 코드로 정의했고 MCP 테스트 138개와 스킬 테스트 73개를 통과했습니다."
                    meta: "Freelance · KREN · 2026.06 – 2026.08"
          - id: open-source
            nav: "오픈소스"
            kicker: "Open source"
            title: "공개하고 관리하는 도구"
            lede: "Obsidian 공식 커뮤니티 플러그인 7개와 MCP 서버, CLI, 에이전트 스킬을 공개해 직접 관리합니다."
            groups:
              - label: "Obsidian plugins"
                cards:
                  - title: "Metadata Auto Classifier"
                    body: "LLM으로 노트의 메타데이터를 자동 분류합니다. 하나의 프로바이더 계층으로 10개 LLM 프리셋을 지원합니다."
                    href: "https://github.com/GoBeromsu/obsidian-metadata-auto-classifier"
                    meta: "★ 59 · ↓ 8,912 · 2024.09 –"
                  - title: "Open Connections"
                    body: "로컬 우선 RAG. 헤딩 단위 청킹과 벡터 검색을 제공하고, MCP 서버로 인덱스를 다른 에이전트에 엽니다."
                    href: "https://github.com/GoBeromsu/obsidian-open-connections"
                    meta: "★ 23 · ↓ 5,031 · 2026.02 –"
                  - title: "Eagle Integration"
                    body: "붙여 넣은 이미지를 Eagle 라이브러리에 올리고 로컬 캐시로 렌더링합니다."
                    href: "https://github.com/GoBeromsu/obsidian-eagle"
                    meta: "★ 11 · ↓ 3,740 · 2025.07 –"
                  - title: "Note Player"
                    body: "노트를 플레이리스트로 삼아 YouTube·캐시 오디오·로컬 파일을 재생합니다."
                    href: "https://github.com/GoBeromsu/obsidian-note-player"
                    meta: "★ 2 · ↓ 525 · 2026.03 –"
                  - title: "QMD Search"
                    body: "로컬 하이브리드 검색(BM25 + vector + HyDE), 관련 노트, 자동 동기화."
                    href: "https://github.com/GoBeromsu/obsidian-qmd"
                    meta: "★ 3 · ↓ 786 · 2026.03 –"
                  - title: "Hermes Control Center"
                    body: "SSH로 원격 Hermes 에이전트 프로필의 칸반·스킬·크론·채팅을 관리합니다."
                    href: "https://github.com/GoBeromsu/obsidian-hermes"
                    meta: "★ 1 · ↓ 125 · 2026.09 –"
                  - title: "Multilingual Bible Search"
                    body: "한·영 성경 구절을 검색해 템플릿으로 삽입합니다."
                    href: "https://github.com/GoBeromsu/obsidian-bible-search"
                    meta: "↓ 34 · 2026.03 –"
              - label: "MCP · CLI"
                cards:
                  - title: "x-m32-mcp-server"
                    body: "Behringer X32/M32 디지털 믹서를 OSC로 제어하는 MCP 서버. 도구 24개로 입력 32채널·버스 16개·FX 랙 8개를 다룹니다."
                    href: "https://github.com/GoBeromsu/XM32-MCP"
                    meta: "★ 5 · npm 3.3.0 · MCP tools 24"
                  - title: "oh-my-second-brain"
                    body: "Markdown·Obsidian 볼트를 Claude Code, Codex, Hermes에 잇는 지식·규약 계층. 하이브리드 검색과 규약 검사 쓰기를 제공합니다."
                    href: "https://github.com/GoBeromsu/oh-my-second-brain"
                    meta: "★ 5 · npm 0.21.0 · MCP tools 4 · skills 6"
                  - title: "zotero-cli"
                    body: "Zotero 로컬·Web API로 라이브러리 검색, 문헌 가져오기, 인용 내보내기를 하는 CLI."
                    href: "https://github.com/GoBeromsu/zotero-cli"
                    meta: "npm 0.5.1"
                  - title: "devonthink-cli"
                    body: "DEVONthink 스크립팅 사전을 감싼 CLI."
                    meta: "npm 0.6.0"
              - label: "Agent skills"
                cards:
                  - title: "craft-skills"
                    body: "코딩 작업을 위한 벤더 중립 에이전트 스킬 모음."
                    href: "https://github.com/GoBeromsu/craft-skills"
                    meta: "skills 48"
                  - title: "secondbrain-skills"
                    body: "LLM이 운영하는 지식 베이스를 위한 에이전트 스킬 모음."
                    href: "https://github.com/GoBeromsu/secondbrain-skills"
                    meta: "skills 25"
              - label: "Featured in"
                cards:
                  - title: "Obsidian Plugins Review\u00A0—\u00A083"
                    body: "Nuno Campos의 플러그인 리뷰 연재가 새 플러그인으로 Metadata Auto Classifier를 다뤘습니다."
                    href: "https://medium.com/technology-hits/obsidian-plugins-review-83-b9a59351199d"
                    meta: "Technology Hits (Medium) · 2024.11.12"
                  - title: "Obsidian Plugin Updates"
                    body: "Ganessh Kumar R P의 주간 뉴스레터가 신규 플러그인으로 Metadata Auto Classifier를 소개했습니다."
                    href: "https://obsidianpluginstats.substack.com/p/obsidian-plugin-updates-2024-10-26"
                    meta: "Obsidian Plugin Stats · 2024.11.02"
          - id: research
            nav: "연구"
            kicker: "Research"
            title: "뒤엉킨 커밋에서 여러 의도를 찾아내기"
            lede:
              "커밋 하나에 뒤섞인 여러 변경 의도를 언어 모델로 찾아내는 제1저자 연구입니다. Empirical Software Engineering(Springer)에 투고해 major revision 의견을 받았고
              2026년 9월 수정본을 냈습니다. 아직 게재가 확정된 것은 아닙니다."
            facts:
              - term: "Title"
                detail: "Detecting Multiple Semantic Concerns in Tangled Code Commits"
                href: "https://arxiv.org/abs/2601.21298"
              - term: "Authors"
                detail: "Beomsu Koh, Neil Walkinshaw, Donghwan Shin"
              - term: "Status"
                detail: "Empirical Software Engineering · major revision, 수정본 제출 (2026.09)"
              - term: "Method"
                detail: "Qwen3.6-27B 파인튜닝, Sheffield Stanage HPC"
              - term: "Result"
                detail: "커밋 메시지를 함께 넣으면 Hamming Loss가 상대적으로 최대 31% 감소"
              - term: "Dataset"
                detail: "tangled-ccs-commits · train 1,400 / test 350, 7\u00A0concerns"
                href: "https://huggingface.co/datasets/Berom0227/tangled-ccs-commits"
          - id: teaching
            kicker: "Teaching & community"
            title: "배운 것을 가르치며 나눕니다"
            lede: "대학 강의와 워크숍, 컨퍼런스에서 에이전트와 스킬, 지식 관리를 강의했습니다. Upstage AI Ambassador로 활동하며 우수 앰배서더로 선정되었고 Skillthon을 개최했습니다."
            timeline:
              - period: "2026.10 – 2026.11"
                title: "극지식물 스마트팜 교육 — Mentor"
                org: "Upstage"
              - period: "2026.09.18 – 19"
                title: "지식 관리로 시작하는 생성형 AI"
                org: "전남대학교 · 2일"
              - period: "2026.09.07 – 10"
                title: "Upstage LLMOps 본과정을 위한 사전교육"
                org: "전남대학교 AI 부트캠프 · 4일 12시간"
              - period: "2026.07.23"
                title: "Agent의 매뉴얼, 나만의 Skill 만들기"
                org: "DGIST AI Build Week 워크숍 · 100분"
                href: "https://www.linkedin.com/feed/update/urn:li:activity:7487500531418943488/"
                image:
                  src: "/static/home/dgist-workshop-2026.jpg"
                  alt: "강의실 스크린에 하루 일정 슬라이드를 띄우고 마이크를 든 채 강의하는 고범수"
                  caption: "DGIST AI Build Week 워크숍"
                  width: 800
                  height: 450
              - period: "2026.05.08"
                title: "AI Agent · Skill 특강"
                org: "전남대학교"
              - period: "2026"
                title: "전남대 × Upstage Skillthon 제안\u2060·\u2060운영"
                org: "47명 · 13팀 참가"
                href: "https://github.com/GoBeromsu/JNU-Upstage-Skillthon"
                image:
                  src: "/static/home/jnu-skillthon-2026.jpg"
                  alt: "컴퓨터실에서 JNU X Upstage Skillthon 일정 슬라이드를 띄우고 설명하는 고범수"
                  caption: "Skillthon 사전 교육"
                  width: 800
                  height: 600
              - period: "2025.10.24"
                title: "AI를 통한 연구 맥락 복원과 지식 관리 워크플로우"
                org: "경남 CMDS PKM Conference 2025 · 컨퍼런스 강연"
              - period: "2024.06.26"
                title: "Obsidian 세미나"
                org: "CCC"
                href: "https://berom.tistory.com/601"
                image:
                  src: "/static/home/obsidian-seminar-2024.jpg"
                  alt: "대형 화면에 'Home Note 만들기' 실습 슬라이드를 띄워 놓고 바닥에 앉아 Obsidian을 설명하는 고범수"
                  caption: "Home Note 만들기 실습"
                  width: 786
