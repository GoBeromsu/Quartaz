              width: 618
              height: 824
            lede: "AI 엔지니어이자 교육자 고범수입니다. 밀도 있게 일하는 것을 좋아하며, 직접 만들고 개선하는 과정에서 배웁니다. 개발 현장에서 얻은 지식과 경험을 동료들과 나누며, 강의와 실습으로 교육을 이어왔습니다."
            stats:
              - value: "7"
                label: "Obsidian plugins"
                note: "공식 커뮤니티 플러그인으로 등록해 직접 관리합니다."
              - value: "19,153"
                label: "Downloads"
                note: "2026년 11월 24일 기준 플러그인 7개의 누적 다운로드 수이며, GitHub 스타는 총 99개입니다."
            quotes:
              - text: "자신을 구하는 유일한 길은 남을 구하려고 애쓰는 것이다."
                cite: "그리스인 조르바 — 니코스 카잔차키스"
              - text: "그가 시험을 받아 고난을 당하셨은즉 시험 받는 자들을 능히 도우실 수 있느니라."
                cite: "히브리서 2:18"
          - id: work
            nav: "작업"
            kicker: "Work"
            title: "현장에서 돌아가게 만든 것"
            lede: "제품이든 Freelance 프로젝트든 구현에서 멈추지 않고, 실제 환경에서 돌아가는 것까지 확인합니다."
            groups:
              - cards:
                  - title: "SeeON"
                    body: "요양 시설 CCTV 영상으로 어르신의 낙상을 실시간 감지해 알리는 시스템입니다. 요양원 테스트베드 실증을 위해 데이터셋, 모델 학습, 백엔드와 GPU 서빙, 관제 프론트, 테스트베드 설치까지 혼자 맡았습니다. CCTV 벤더 종속과 CPU 복사 병목으로 카메라당 수집이 8.96fps에 머물자, 현장 NVR 망에 직접 접속해 RTSP 스트림을 확보하고 현장 허브와 DeepStream을 구축했습니다. 영상 수집 주도권을 확보했고, 프레임당 CPU 복사량을 98% 줄였으며, RTX 5070 Ti 한 장으로 카메라 13대의 카메라당 수집을 234% 늘렸습니다(29.97fps). 학습·평가 데이터는 피험자 ID가 겹치지 않게 분할했고, 카메라 13대로 부하 테스트를 했습니다. 운영 중 GPU 장애와 CPU 부하 상승을 포착해 NVIDIA 라이브러리부터 CUDA와 드라이버까지 추적했고, 카메라별 장애 격리와 부팅 시 CUDA preflight 검사로 비정상 상태로 서빙되는 것을 사전에 차단합니다."
                    meta: "Senior AI Lab · 2026.06 – 2026.10"
                  - title: "SICHIMI AI Ops"
                    body: "KREN의 GitOps 네트워크 운영에 에이전트를 도입한 AX 프로젝트로, 설계와 구현을 혼자 맡았습니다. 운영팀 인터뷰와 팀 장애 때 옆에서 에이전트로 직접 추적해 Kubernetes Pod와 GitOps(Argo CD) 상태에 접근할 수 있음을 확인했고, Keycloak 기반 고객 환경에 read-only, propose-only 경계를 두어 트래픽이 많은 서버와 인증 정보에 닿는 민감한 변경은 사람이 승인합니다. Hermes Agent로 구성해 담당자 한 사람에게 있던 에이전트 설정과 운영 노하우를 조직 소유의 코드와 문서로 자산화했습니다. 조율 전담 orchestrator 1개와 역할별 worker 11개로 분업하고, Hermes 설정을 GitOps 체제에 편입해 팀별 Slack 채널에서 운영합니다. 팀에 에이전트와 스킬을 교육해 팀 작업 방식을 스킬로 정리했고, 에이전트를 Codex에서 실행해 기존 팀 플랜으로 추가 비용 없이 적용했습니다."
                    meta: "Freelance · KREN · 2026.06 – 2026.08"
                  - title: "OSS Hub"
                    body: "에이전트 주도 개발을 품질 기준으로 통제하며 만든 전남대 오픈소스 기여 추적 플랫폼입니다. 교수, 학생, 교직원 인터뷰로 요구사항을 조율했고, 웹 입문 학생 3명과 함께 에이전트가 티켓별 구현과 1차 리뷰를, 사람이 요구사항 정의와 merge 결정을 맡아 운영 배포했습니다. 운영 웹 서비스를 점검해 Lighthouse 성능 점수가 최저 39임을 확인하고, CLI로 재는 프론트엔드(LCP, CLS)와 백엔드(경로별 쿼리 수) 임계값을 에이전트의 objective로 삼아 반복 개선했습니다. LCP를 최대 83% 줄였고, 데이터가 10배로 늘어도 쿼리 수는 그대로입니다. 에이전트 작업에서 생긴 잘못된 패턴이 코드베이스로 퍼져 폴더가 늘고 상태가 분산되자, 스킬과 변경 범위별 CLI로 팀 코드베이스 반영 전에 API 계약, DTO, 아키텍처 규칙을 강제해 에이전트의 잘못된 패턴을 결정적으로 차단합니다."
                    href: "https://jnu-oss-hub.com/"
                    meta: "전남대학교 SW중심대학사업단 · 2026.07 – 현재"
          - id: research
            nav: "연구"
            kicker: "Research"
            title: "Detecting Multiple Semantic Concerns in Tangled Code Commits"
            lede: "실제 커밋에 여러 의도가 섞여 개발자 생산성에 중요한 커밋 이력을 활용하기 어렵다는 문제에서 출발한 Sheffield 석사 논문 연구입니다. 실험 설계, 검증, 데이터셋 구축, 모델 학습 전 과정을 수행했고, 제1저자로 Empirical Software Engineering에서 심사 중입니다. 아래 인용은 arXiv:2601.21298v3 초록 원문입니다."
            facts:
              - term: "Title"
                detail: "Detecting Multiple Semantic Concerns in Tangled Code Commits"
                href: "https://arxiv.org/abs/2601.21298v3"
              - term: "Authors"
                detail: "Beomsu Koh, Neil Walkinshaw, Donghwan Shin"
              - term: "Status"
                detail: "Empirical Software Engineering · 심사 중"
              - term: "Code"
                detail: "Replication package"
                href: "https://github.com/GoBeromsu/Detecting-Multiple-Semantic-Concerns-in-Tangled-Code-Commits-using-Small-Language-Models"
            quotes:
              - text: "In this paper, we frame multi-concern detection in tangled commits as a multi-label classification problem and construct a controlled dataset of artificially tangled commits based on real-world data."
                cite: "Koh, Walkinshaw, Shin — arXiv:2601.21298v3, Abstract"
              - text: "Our results show that a fine-tuned 27B-parameter SLM outperforms a state-of-the-art LLM across all concern counts. In particular, including commit messages improves detection accuracy by up to 31% (in terms of Hamming Loss) with negligible latency overhead, establishing them as important semantic cues."
                cite: "Koh, Walkinshaw, Shin — arXiv:2601.21298v3, Abstract"
          - id: teaching
            kicker: "Teaching & community"
            title: "강의 · 멘토링 · 심사"
            lede: "대학 강의, 워크숍, 컨퍼런스에서 에이전트·스킬·지식 관리를 가르칩니다. Upstage AI Ambassador로 Skillthon을 기획·운영·심사했고 우수 앰배서더로 선정되었습니다."
            timeline:
              - period: "2026.11"
                title: "MacBook으로 익히는 AI 에이전트와 개발 생산성"
