              - id: work
                nav: "Work"
                kicker: "Work"
                title: "Work that runs in the field"
                lede: "Product or freelance, I take every project past the build and verify it runs in a real environment."
                groups:
                  - cards:
                      - title: "SeeON"
                        body: "Detects falls of older adults in care-facility CCTV video in real time and raises alerts. For the care-home testbed, I handled everything alone: dataset, model training, backend and GPU serving, monitoring frontend and testbed installation. CCTV vendor lock-in and a CPU copy bottleneck held capture to 8.96 fps per camera, so I connected directly to the on-site NVR network for the RTSP streams and built an on-site hub with DeepStream. That secured control of video capture, cut CPU copying per frame by 98%, and raised per-camera capture by 234% (29.97 fps) across 13 cameras on a single RTX 5070 Ti. Train and evaluation splits share no actor IDs; load-tested with 13 cameras. Caught GPU faults and rising CPU load in operation and traced them from the NVIDIA libraries down to CUDA and the driver; per-camera fault isolation and a CUDA preflight check at boot keep it from serving in a bad state."
                        meta: "Senior AI Lab · 2026.06 – 2026.10"
                      - title: "SICHIMI AI Ops"
                        body: "AI-transformation project that brought agents into KREN's GitOps network operations; I designed and built it alone. Interviews with the operations team, and tracing a team incident alongside them with an agent, confirmed that agents could reach Kubernetes Pod and GitOps (Argo CD) state. For the Keycloak-based client environment I set read-only, propose-only boundaries; sensitive changes touching high-traffic servers or credentials need human approval. Built on Hermes Agent, it turned agent configuration and operating know-how held by one person into code and documents the organisation owns. One orchestrator coordinates 11 role-based workers; the Hermes configuration sits under GitOps, and the agents run in each team's Slack channel. Trained the team on what agents and skills are, captured their ways of working as skills, and ran the agents in Codex on the team's existing plan at no extra cost."
                        meta: "Freelance · KREN · 2026.06 – 2026.08"
                      - title: "OSS Hub"
                        body: "A Chonnam open-source contribution tracker built with agent-driven development held to quality gates. Aligned requirements through interviews with professors, students and staff; with three students new to web development, agents handled per-ticket implementation and first review while people owned requirements and merge decisions, and it shipped to production. A check of the production web service found Lighthouse performance scores as low as 39, so I made CLI-measured thresholds for the frontend (LCP, CLS) and backend (per-route query counts) the agents' objective and improved iteratively: LCP down by up to 83%, and query counts unchanged at 10x the data. Bad patterns from agent work were spreading through the codebase, multiplying folders and scattering state, so skills and scope-aware CLIs now enforce API contracts, DTOs and architecture rules before changes reach the team codebase, deterministically blocking agents' bad patterns."
                        href: "https://jnu-oss-hub.com/"
                        meta: "Chonnam National University, SW-centred University Project · 2026.07 – present"
              - id: research
                nav: "Research"
                kicker: "Research"
                title: "Detecting Multiple Semantic Concerns in Tangled Code Commits"
                lede: "My Sheffield master's dissertation research, which started from a problem: real commits mix several intents, making commit history, which matters for developer productivity, hard to use. I carried out the whole process, from experiment design and validation to dataset construction and model training. First author; under review at Empirical Software Engineering. The quotes below are verbatim from the arXiv:2601.21298v3 abstract."
                facts:
                  - term: "Title"
                    detail: "Detecting Multiple Semantic Concerns in Tangled Code Commits"
                    href: "https://arxiv.org/abs/2601.21298v3"
                  - term: "Authors"
                    detail: "Beomsu Koh, Neil Walkinshaw, Donghwan Shin"
                  - term: "Status"
                    detail: "Empirical Software Engineering · under review"
                  - term: "Code"
                    detail: "Replication package"
                    href: "https://github.com/GoBeromsu/Detecting-Multiple-Semantic-Concerns-in-Tangled-Code-Commits-using-Small-Language-Models"
                quotes:
                  - text: "In this paper, we frame multi-concern detection in tangled commits as a multi-label classification problem and construct a controlled dataset of artificially tangled commits based on real-world data."
                    cite: "Koh, Walkinshaw, Shin — arXiv:2601.21298v3, Abstract"
                  - text: "Our results show that a fine-tuned 27B-parameter SLM outperforms a state-of-the-art LLM across all concern counts. In particular, including commit messages improves detection accuracy by up to 31% (in terms of Hamming Loss) with negligible latency overhead, establishing them as important semantic cues."
                    cite: "Koh, Walkinshaw, Shin — arXiv:2601.21298v3, Abstract"
