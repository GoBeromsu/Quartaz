# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: Ataraxia (local)
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  locale: ko-KR
  baseUrl: 100.122.16.120:8090
  multilingual:
    enabled: true
    sourceLocale: ko
    targetLocales: []
    locales:
      - id: ko
        locale: ko-KR
        routePrefix: /ko/
        direction: ltr
        label: Korean
        nativeName: 한국어
    localizedSlug: false
    defaultLocaleRoute: /ko/
    xDefaultRoute: /
    legacyRedirects:
      flatPermalinks: true
      status: 301
      noindex: true
    contentIndex:
      search: all
      rss: source
      sitemap: all
  ignorePatterns:
    - .git/**
    - "**/.gitignore"
    - .obsidian/**
    - .smart-env/**
    - .trash/**
    - "**/*.pdf"
    - "**/*.canvas"
    - "**/.DS_Store"
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Inter
      body: Inter
      code: IBM Plex Mono
    colors:
      lightMode:
        light: "#ffffff"
        lightgray: "#e6e6e6"
        gray: "#737373"
        darkgray: "#0f0f0f"
        dark: "#0f0f0f"
        secondary: "#a52142"
        tertiary: "#c75b75"
        highlight: "rgba(165, 33, 66, 0.08)"
        textHighlight: "#fff23688"
      darkMode:
        light: "#262626"
        lightgray: "#353535"
        gray: "#8c8c8c"
        darkgray: "#d1d1d1"
        dark: "#d1d1d1"
        secondary: "#c75b75"
        tertiary: "#a52142"
        highlight: "rgba(165, 33, 66, 0.12)"
        textHighlight: "#b3aa0288"
plugins:
  - source: ./plugins/legacy-frontmatter-dates
    enabled: true
    order: 5
  - source: github:quartz-community/note-properties
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: false
      delimiters: "---"
      language: yaml
    order: 6
  - source: github:quartz-community/created-modified-date
    enabled: true
    options:
      defaultDateType: created
      priority:
        - frontmatter
        - filesystem
    order: 10
  - source: github:quartz-community/syntax-highlighting
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: github:quartz-community/obsidian-flavored-markdown
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30
  - source: github:quartz-community/github-flavored-markdown
    enabled: true
    order: 40
  - source: github:quartz-community/table-of-contents
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
      condition: has-toc
      display: desktop-only
  - source: github:quartz-community/crawl-links
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: github:quartz-community/description
    enabled: true
    order: 70
  - source: github:quartz-community/latex
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: github:quartz-community/alias-redirects
    enabled: true
  - source: ./plugins/multilingual-content-index
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
      contentMaxChars: 500
      emitGraphIndex: true
  - source: ./plugins/graph-landing
    enabled: true
    options:
      indexSource: graphIndex
      maxRenderedNodes: 1500
      expandHops: 1
      tagCooccurrence:
        maxTagsPerNote: 6
        maxEdges: 5000
      renderMode: "3d"
      layout:
        freezeAfterWarmup: true
      lod:
        labelDistance: 800
        dotDistance: 1200
        cullDistance: 1600
        fog: true
        nodeResolution: 8
        linkResolution: 3
      ambientVideoId: o6HpCFhNcnQ
  - source: ./plugins/blog-chrome
    enabled: true
  - source: ./plugins/blog-home
    enabled: true
  - source: github:quartz-community/favicon
    enabled: true
  - source: github:quartz-community/content-page
    enabled: true
  - source: github:quartz-community/folder-page
    enabled: true
  - source: github:quartz-community/tag-page
    enabled: true
  - source: github:quartz-community/page-title
    enabled: true
  - source: github:quartz-community/search
    enabled: true
  - source: github:quartz-community/darkmode
    enabled: true
  - source: github:quartz-community/breadcrumbs
    enabled: true
  - source: github:quartz-community/article-title
    enabled: true
  - source: github:quartz-community/content-meta
    enabled: true
  - source: github:quartz-community/tag-list
    enabled: true
layout:
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content:
      template: full-width
      positions:
        left: []
    folder:
      template: full-width
      positions:
        left: []
        right: []
    tag:
      template: full-width
      positions:
        left: []
        right: []
    graph:
      template: minimal
      positions:
        left: []
        right: []
        beforeBody: []
