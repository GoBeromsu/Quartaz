              - id: research
                nav: "Research"
                kicker: "Research"
                title: "Finding several intents in one tangled commit"
                lede: "First-author research on detecting the multiple concerns mixed into a single commit with language models. Empirical Software Engineering returned a major revision; the revised version went in September 2026 and is not yet accepted."
                facts:
                  - term: "Title"
                    detail: "Detecting Multiple Semantic Concerns in Tangled Code Commits"
                    href: "https://arxiv.org/abs/2601.21298"
                  - term: "Authors"
                    detail: "Beomsu Koh, Neil Walkinshaw, Donghwan Shin"
                  - term: "Status"
                    detail: "Empirical Software Engineering (Springer) · major revision, revised version submitted (2026.09)"
                  - term: "Method"
                    detail: "LoRA fine-tuning on a single GPU (H100: Qwen3-14B; RTX PRO 6000 96GB: Qwen3.6-27B)"
                  - term: "Result"
                    detail: "Lower Hamming Loss than GPT-4.1; up to 31% lower with commit messages included"
                  - term: "Dataset"
                    detail: "tangled-ccs-commits · train 1,400 / test 350, 7\u00A0concerns"
                    href: "https://huggingface.co/datasets/Berom0227/tangled-ccs-commits"
                  - term: "Models"
                    detail: "8 models released on Hugging Face"
                    href: "https://huggingface.co/Berom0227"
