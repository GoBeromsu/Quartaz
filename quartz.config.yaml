# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: Beomsu Koh
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: google
    tagId: G-P07C416MPF
  locale: ko-KR
  baseUrl: beomsukoh.com
  ignorePatterns:
    - .git
    - .gitignore
    - .obsidian
    - "**/*.pdf"
    - "**/*.canvas"
    - "**/private/*"
    - .smart-env
    - 50. Calendar
    - 70. Settings
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Inter
      body: Inter
      code: IBM Plex Mono
    colors:
      lightMode:
        light: "#ffffff"
        lightgray: "#e6e6e6"
        gray: "#737373"
        darkgray: "#0f0f0f"
        dark: "#0f0f0f"
        secondary: "#a52142"
        tertiary: "#c75b75"
        highlight: "rgba(165, 33, 66, 0.08)"
        textHighlight: "#fff23688"
      darkMode:
        light: "#000000"
        lightgray: "#24262a"
        gray: "#8f9093"
        darkgray: "#fbfbfb"
        dark: "#fbfbfb"
        secondary: "#c75b75"
        tertiary: "#a52142"
        highlight: "rgba(165, 33, 66, 0.12)"
        textHighlight: "#b3aa0288"
  links:
    markdownLinkResolution: shortest
  contentIndex:
    enableSiteMap: true
    enableRSS: true
plugins:
  - source: ./plugins/legacy-frontmatter-dates
    enabled: true
    order: 5
  - source: ./plugins/permalink-slug
    enabled: true
    order: 7
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: false
    order: 6
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: created
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  # Mermaid fences render with Pele (released in obsidian-flavored-markdown 2.3)
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
      diagramRenderer: pele
    order: 40
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 30
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
      condition: has-toc
      display: desktop-only
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/unlisted-pages"
    enabled: true
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: ./plugins/graph-landing
    enabled: true
    options:
      landingSlugs: [index]
      expandHops: 1
      tagCooccurrence:
        maxTagsPerNote: 6
        maxEdges: 5000
      renderMode: "3d"
      layout:
        freezeAfterWarmup: true
        incrementalWarmup: true
      interaction:
        incrementalRepaint: true
      lod:
        labelDistance: 800
        linkResolution: 3
        shareLinkResources: true
      music:
        tracks:
          - title: "EVERYTHING"
            artist: "Paikon's Piano Cover"
            url: "https://www.youtube.com/watch?v=erKAm7HRw3c&list=RDerKAm7HRw3c&start_radio=1"
          - title: "Ambient Constellation"
            url: "https://www.youtube.com/watch?v=o6HpCFhNcnQ"
      hero:
        eyebrow: "Beomsu Koh"
        title: "기술은 의도를\n증폭한다."
        titleEmphasis: "의도"
        lede: "사람들이 원치 않게 빼앗기는 인지 자원을 지키는 기술을 만듭니다. 도구가 무엇을 할 수 있는지보다 누구의 의도를 키우는지가 중요합니다."
        actions:
          - label: "소개"
            href: "/about"
            accent: true
          - label: "블로그"
            href: "/writing"
        fallbackLanguage: en
        translations:
          en:
            actions:
              - label: "About"
                href: "/about"
                accent: true
              - label: "Blog"
                href: "/writing"
            title: "Technology\namplifies intent."
            titleEmphasis: "intent"
            lede:
              "I build technology that protects the attention people never meant to give away. What matters is not what a tool
              can do, but whose intent it amplifies."
      profile:
        sections:
          - id: now
            kicker: "What I do"
            title: "에이전트로 제품을 만들고 운영합니다."
            image:
              src: "/static/home/beomsu-thumbs-up.jpg"
              alt: "바다가 보이는 절벽 위 잔디밭에서 엄지를 들어 보이며 웃는 고범수"
              width: 618
              height: 824
            lede: "AI 엔지니어이자 교육자 고범수입니다. 밀도 있게 일하는 것을 좋아하며, 직접 만들고 개선하는 과정에서 배웁니다. 개발 현장에서 얻은 지식과 경험을 동료들과 나누며, 강의와 실습으로 교육을 이어왔습니다."
            stats:
              - value: "7"
                label: "Obsidian plugins"
                note: "공식 커뮤니티 플러그인으로 등록해 직접 관리합니다."
              - value: "19,153"
                label: "Downloads"
                note: "2026년 11월 24일 기준 플러그인 7개의 누적 다운로드 수이며, GitHub 스타는 총 99개입니다."
          - id: work
            nav: "작업"
            kicker: "Work"
            title: "현장에서 돌아가게 만든 것"
            lede: "제품이든 Freelance 프로젝트든 구현에서 멈추지 않고, 실제 환경에서 돌아가는 것까지 확인합니다."
            groups:
              - cards:
                  - title: "SeeON"
                    body: "요양 시설 CCTV 영상으로 어르신의 낙상을 실시간 감지해 알리는 시스템을 데이터셋부터 테스트베드 설치까지 혼자 만들었습니다. 현장 NVR 망에서 RTSP 스트림을 확보하고 DeepStream을 구축해, RTX 5070 Ti 한 장으로 카메라 13대의 카메라당 수집을 234% 늘렸습니다(29.97fps)."
                    meta: "Senior AI Lab · 2026.06 – 2026.10"
                  - title: "SICHIMI AI Ops"
                    body: "KREN의 GitOps 네트워크 운영에 에이전트를 도입한 AX 프로젝트로, 설계와 구현을 혼자 맡았습니다. Hermes Agent로 구성해 담당자 한 사람에게 있던 에이전트 설정과 운영 노하우를 조직 소유의 코드와 문서로 자산화했습니다."
                    meta: "Freelance · KREN · 2026.06 – 2026.08"
                  - title: "OSS Hub"
                    body: "에이전트 주도 개발을 품질 기준으로 통제하며 만든 전남대 오픈소스 기여 추적 플랫폼으로, 웹 입문 학생 3명과 운영 배포했습니다. Lighthouse 성능 점수가 최저 39임을 확인하고 CLI로 재는 임계값을 에이전트의 objective로 삼아 반복 개선해, LCP를 최대 83% 줄였습니다."
                    href: "https://jnu-oss-hub.com/"
                    meta: "전남대학교 SW중심대학사업단 · 2026.07 – 현재"
          - id: research
            nav: "연구"
            kicker: "Research"
            title: "Detecting Multiple Semantic Concerns in Tangled Code Commits"
            lede: "실제 커밋에 여러 의도가 섞여 개발자 생산성에 중요한 커밋 이력을 활용하기 어렵다는 문제에서 출발한 Sheffield 석사 논문 연구입니다. 실험 설계, 검증, 데이터셋 구축, 모델 학습 전 과정을 수행했습니다."
            facts:
              - term: "arXiv"
                detail: "2601.21298v3"
                href: "https://arxiv.org/abs/2601.21298v3"
              - term: "Authors"
                detail: "Beomsu Koh, Neil Walkinshaw, Donghwan Shin"
              - term: "Status"
                detail: "Empirical Software Engineering · 심사 중"
              - term: "Code"
                detail: "Replication package"
                href: "https://github.com/GoBeromsu/Detecting-Multiple-Semantic-Concerns-in-Tangled-Code-Commits-using-Small-Language-Models"
            quotes:
              - text: "In this paper, we frame multi-concern detection in tangled commits as a multi-label classification problem and construct a controlled dataset of artificially tangled commits based on real-world data."
                cite: "Koh, Walkinshaw, Shin — arXiv:2601.21298v3, Abstract"
              - text: "Our results show that a fine-tuned 27B-parameter SLM outperforms a state-of-the-art LLM across all concern counts. In particular, including commit messages improves detection accuracy by up to 31% (in terms of Hamming Loss) with negligible latency overhead, establishing them as important semantic cues."
                cite: "Koh, Walkinshaw, Shin — arXiv:2601.21298v3, Abstract"
          - id: teaching
            kicker: "Teaching & speaking"
            title: "강의 · 강연 · 멘토링"
            lede: "대학 강의와 워크숍에서 에이전트·스킬·지식 관리를 가르치고, 컨퍼런스에서 강연합니다."
            timeline:
              - period: "2026.11"
                title: "MacBook으로 익히는 AI 에이전트와 개발 생산성"
                org: "전남대학교 · 연사"
