          - id: open-source
            nav: "오픈소스"
            kicker: "Open source"
            title: "공개하고 관리하는 도구"
            lede: "Obsidian 공식 커뮤니티 플러그인 7개, MCP 서버, CLI, 에이전트 스킬을 공개해 직접 관리합니다. npm 다운로드 수는 2026년 11월 25일 기준 누적입니다. 아래 목록에는 GitHub에 공개한 나머지 저장소를 정리했습니다."
            groups:
              - label: "Obsidian plugins"
                cards:
                  - title: "Metadata Auto Classifier"
                    body: "secondbrain을 에이전트로 구현하려는 시도로, 노트 컨벤션에 맞는 태그와 frontmatter를 LLM으로 분류합니다. 노트마다 볼트의 기존 값 중 맞는 것을 판정해 확신한 값만 기록하고, LM Studio 등 사용자 요청을 반영했습니다."
                    href: "https://github.com/GoBeromsu/obsidian-metadata-auto-classifier"
                    meta: "★ 59 · ↓ 8,912 · 2024.09 –"
                  - title: "Open Connections"
                    body: "1만 3천 노트 볼트의 embedding 색인 중 DB 전체를 한 번에 직렬화해 메모리가 초과되자, native 모듈 없이 모든 환경에서 돌도록 내장 SQLite로 파일에 저장하고, 벡터는 4 byte로 줄여 저장 후 해제해 메모리 누적을 막았습니다."
                    href: "https://github.com/GoBeromsu/obsidian-open-connections"
                    meta: "★ 23 · ↓ 5,031 · 2026.02 –"
                  - title: "Eagle Integration"
                    body: "붙여 넣은 이미지를 Eagle 라이브러리에 올리고 로컬 캐시로 렌더링합니다."
                    href: "https://github.com/GoBeromsu/obsidian-eagle"
                    meta: "★ 11 · ↓ 3,740 · 2025.07 –"
                  - title: "Note Player"
                    body: "노트를 플레이리스트로 삼아 YouTube·캐시 오디오·로컬 파일을 재생합니다."
                    href: "https://github.com/GoBeromsu/obsidian-note-player"
                    meta: "★ 2 · ↓ 525 · 2026.03 –"
                  - title: "QMD Search"
                    body: "BM25, 벡터, HyDE를 결합한 로컬 하이브리드 검색과 관련 노트 보기, 자동 동기화를 제공합니다."
                    href: "https://github.com/GoBeromsu/obsidian-qmd"
                    meta: "★ 3 · ↓ 786 · 2026.03 –"
                  - title: "Hermes Control Center"
                    body: "SSH로 원격 Hermes 에이전트 프로필의 칸반·스킬·크론·채팅을 관리합니다."
                    href: "https://github.com/GoBeromsu/obsidian-hermes"
                    meta: "★ 1 · ↓ 125 · 2026.09 –"
