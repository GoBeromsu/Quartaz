# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: Beomsu Koh
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: google
    tagId: G-P07C416MPF
  locale: ko-KR
  baseUrl: beomsukoh.com
  ignorePatterns:
    - .git
    - .gitignore
    - .obsidian
    - "**/*.pdf"
    - "**/*.canvas"
    - "**/private/*"
    - .smart-env
    - 50. Calendar
    - 70. Settings
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Inter
      body: Inter
      code: IBM Plex Mono
    colors:
      lightMode:
        light: "#ffffff"
        lightgray: "#e6e6e6"
        gray: "#737373"
        darkgray: "#0f0f0f"
        dark: "#0f0f0f"
        secondary: "#a52142"
        tertiary: "#c75b75"
        highlight: "rgba(165, 33, 66, 0.08)"
        textHighlight: "#fff23688"
      darkMode:
        light: "#262626"
        lightgray: "#353535"
        gray: "#8c8c8c"
        darkgray: "#d1d1d1"
        dark: "#d1d1d1"
        secondary: "#c75b75"
        tertiary: "#a52142"
        highlight: "rgba(165, 33, 66, 0.12)"
        textHighlight: "#b3aa0288"
plugins:
  - source: ./plugins/legacy-frontmatter-dates
    enabled: true
    order: 5
  - source: ./plugins/permalink-slug
    enabled: true
    order: 7
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: false
      delimiters: "---"
      language: yaml
    order: 6
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: created
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
      condition: has-toc
      display: desktop-only
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/remove-draft"
    enabled: true
  - source: "@quartz-community/unlisted-pages"
    enabled: true
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: ./plugins/graph-landing
    enabled: true
    options:
      expandHops: 1
      tagCooccurrence:
        maxTagsPerNote: 6
        maxEdges: 5000
      renderMode: "3d"
      layout:
        freezeAfterWarmup: true
        incrementalWarmup: true
      interaction:
        incrementalRepaint: true
      lod:
        labelDistance: 800
        fog: true
        linkResolution: 3
        shareLinkResources: true
      music:
        tracks:
          - title: "EVERYTHING"
            artist: "Paikon's Piano Cover"
            url: "https://www.youtube.com/watch?v=erKAm7HRw3c&list=RDerKAm7HRw3c&start_radio=1"
          - title: "Ambient Constellation"
            url: "https://www.youtube.com/watch?v=o6HpCFhNcnQ"
      hero:
        eyebrow: "Beomsu Koh · Senior AI Lab"
        title: "기술은 의도를\n증폭한다."
        titleEmphasis: "의도"
        lede: "사람들이 원치 않게 탈취당하는 인지 자원을 지키는 기술을 만듭니다. 도구가 무엇을 할 수 있는지보다, 누구의 의도를 키우는지가 중요합니다."
        actions:
          - label: "About"
            href: "/about"
            accent: true
          - label: "Writing"
            href: "/writing"
        fallbackLanguage: en
        translations:
          en:
            title: "Technology\namplifies intent."
            titleEmphasis: "intent"
            lede: "I build technology that protects the attention people never meant to give away. What matters is not what a tool can do, but whose intent it amplifies."
  - source: ./plugins/blog-chrome
    enabled: true
  - source: ./plugins/blog-home
    enabled: true
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: true
  - source: "@quartz-community/cname"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  - source: "@quartz-community/page-title"
    enabled: true
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: footer
      priority: 20
  - source: "@quartz-community/darkmode"
    enabled: true
  - source: "@quartz-community/breadcrumbs"
    enabled: true
  - source: "@quartz-community/article-title"
    enabled: true
  - source: "@quartz-community/content-meta"
    enabled: true
  - source: "@quartz-community/tag-list"
    enabled: true
  - source: "@quartz-community/comments"
    enabled: true
layout:
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content:
      template: full-width
      positions:
        left: []
    folder:
      template: full-width
      positions:
        left: []
        right: []
    tag:
      template: full-width
      positions:
        left: []
        right: []
    graph:
      template: minimal
      positions:
        left: []
        right: []
        beforeBody: []
