# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: Beomsu Koh
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: google
    tagId: G-P07C416MPF
  locale: ko-KR
  baseUrl: beomsukoh.com
  ignorePatterns:
    - .git
    - .gitignore
    - .obsidian
    - "**/*.pdf"
    - "**/*.canvas"
    - "**/private/*"
    - .smart-env
    - 50. Calendar
    - 70. Settings
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Inter
      body: Inter
      code: IBM Plex Mono
    colors:
      lightMode:
        light: "#ffffff"
        lightgray: "#e6e6e6"
        gray: "#737373"
        darkgray: "#0f0f0f"
        dark: "#0f0f0f"
        secondary: "#a52142"
        tertiary: "#c75b75"
        highlight: "rgba(165, 33, 66, 0.08)"
        textHighlight: "#fff23688"
      darkMode:
        light: "#262626"
        lightgray: "#353535"
        gray: "#8c8c8c"
        darkgray: "#d1d1d1"
        dark: "#d1d1d1"
        secondary: "#c75b75"
        tertiary: "#a52142"
        highlight: "rgba(165, 33, 66, 0.12)"
        textHighlight: "#b3aa0288"
  links:
    markdownLinkResolution: shortest
  contentIndex:
    enableSiteMap: true
    enableRSS: true
plugins:
  - source: ./plugins/legacy-frontmatter-dates
    enabled: true
    order: 5
  - source: ./plugins/permalink-slug
    enabled: true
    order: 7
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: false
    order: 6
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: created
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  # Mermaid fences render with Pele (released in obsidian-flavored-markdown 2.3)
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
      diagramRenderer: pele
    order: 40
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 30
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
      condition: has-toc
      display: desktop-only
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/unlisted-pages"
    enabled: true
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: ./plugins/graph-landing
    enabled: true
    options:
      landingSlugs: [index]
      expandHops: 1
      tagCooccurrence:
        maxTagsPerNote: 6
        maxEdges: 5000
      renderMode: "3d"
      layout:
        freezeAfterWarmup: true
        incrementalWarmup: true
      interaction:
        incrementalRepaint: true
      lod:
        labelDistance: 800
        fog: true
        linkResolution: 3
        shareLinkResources: true
      music:
        tracks:
          - title: "EVERYTHING"
            artist: "Paikon's Piano Cover"
            url: "https://www.youtube.com/watch?v=erKAm7HRw3c&list=RDerKAm7HRw3c&start_radio=1"
          - title: "Ambient Constellation"
            url: "https://www.youtube.com/watch?v=o6HpCFhNcnQ"
      hero:
        eyebrow: "Beomsu Koh"
        title: "기술은 의도를\n증폭한다."
        titleEmphasis: "의도"
        lede: "사람들이 원치 않게 빼앗기는 인지 자원을 지키는 기술을 만듭니다. 도구가 무엇을 할 수 있는지보다 누구의 의도를 키우는지가 중요합니다."
        actions:
          - label: "소개"
            href: "/about"
            accent: true
          - label: "블로그"
            href: "/writing"
        fallbackLanguage: en
        translations:
          en:
            actions:
              - label: "About"
                href: "/about"
                accent: true
              - label: "Blog"
                href: "/writing"
            title: "Technology\namplifies intent."
            titleEmphasis: "intent"
            lede:
              "I build technology that protects the attention people never meant to give away. What matters is not what a tool
              can do, but whose intent it amplifies."
      profile:
        sections:
          - id: now
            kicker: "What I do"
            title: "에이전트와 함께 제품을 개발하고 운영합니다."
            image:
              src: "/static/home/beomsu-thumbs-up.jpg"
              alt: "바다가 보이는 절벽 위 잔디밭에서 엄지를 들어 보이며 웃는 고범수"
              width: 618
              height: 824
            lede: "아이디어를 실제 제품으로 구현하는 AI 엔지니어 고범수입니다. LLM과 에이전트로 만든 제품을 직접 쓰며 개선합니다. Obsidian 플러그인과 에이전트 스킬을 오픈소스로 관리하고, 현장 경험을 강의와 실습으로 나눕니다."
            stats:
              - value: "7"
                label: "Obsidian plugins"
                note: "공식 커뮤니티 플러그인으로 등록해 직접 관리합니다."
              - value: "19,153"
                label: "Downloads"
                note: "2026년 11월 24일 기준 플러그인 7개의 누적 다운로드 수이며, GitHub 스타는 총 99개입니다."
              - value: "68"
                label: "Agent skills"
                note: "craft-skills 48개와 secondbrain-skills 20개를 공개했습니다."
            quotes:
              - text: "자신을 구하는 유일한 길은 남을 구하려고 애쓰는 것이다."
                cite: "그리스인 조르바 — 니코스 카잔차키스"
              - text: "그가 시험을 받아 고난을 당하셨은즉 시험 받는 자들을 능히 도우실 수 있느니라."
                cite: "히브리서 2:18"
          - id: path
            kicker: "Path"
            title: "지금까지 걸어온 길"
            lede: "네트워크 연구실에서 출발해 소프트웨어 공학을 연구했으며, 현재는 에이전트로 제품을 개발하고 교육 활동을 병행하고 있습니다."
            timeline:
              - period: "2018.03 – 2024.08"
                title: "BSc in Software Engineering"
                org: "전남대학교"
                body: "2022년 11월 정보처리기사를 취득했습니다."
              - period: "2020.08 – 2022.04"
                title: "군 복무"
                org: "해양경찰"
              - period: "2022.03 – 2024.06"
                title: "Undergraduate Researcher, RA"
                org: "Advanced Network Lab, 전남대학교"
                body: "5G Open Test Lab 연계 Wi-Fi 6 로밍을 개발해 ETRI와 공동 실증하고 5G MEC를 시연했습니다. 캠퍼스 Wi-Fi 로그로 트래픽 예측을 Grafana에 시각화했고, Educonnect(eduroam KR) 인증 서버 radsecproxy의 배포를 GitHub Actions와 Jenkins로 자동화해 Prometheus·Loki·Grafana로 모니터링했습니다. 2023.03 – 2024.06에는 데이터 통신·컴퓨터 네트워크 TA를 맡았습니다."
              - period: "2022.05 – 2022.12"
                title: "5G MEC(Mobile Edge Computing)를 이용한 실시간 저지연 음악 협업 서비스 — PM"
                org: "K-디지털 챌린지 : NET 챌린지 캠프 시즌9 · 오케스트라이브 팀 (4인)"
                body: "오디오 지연으로 어려운 온라인 합주를 푸는 WebRTC 서비스를 만들어 KOREN 5G MEC에 배포했습니다. 시그널링·미디어 서버를 구축하고, 배포 후 화면이 나오지 않던 장애를 Coturn STUN·TURN으로 해결했습니다. MCU·SFU 병용과 RTP/NTP 동기화로 비디오 7개 평균 50ms를 달성해 은상을 받았습니다."
              - period: "2023.07 – 2023.08"
                title: "Summer Intern"
                org: "한국에너지공과대학교(KENTECH)"
              - period: "2023.03 – 2023.11"
                title: "축팅 — Backend Tech Lead"
                org: "카카오 테크 캠퍼스 1기 백엔드 트랙"
                body: "7인 팀의 백엔드 테크리더로 팀 프로젝트 축팅의 서버와 배포를 맡았습니다. 단계별 PR마다 현업 멘토의 코드 리뷰를 받으며 Usecase와 Port로 서비스 계층을 분리했고, 카카오 클라우드 크램폴린의 Kubernetes에 D2Hub 이미지, Kargo, Ingress로 서버를 배포했습니다. 1MB가 넘는 사진 업로드에서만 나던 413 오류의 원인을 플랫폼 앞단 Nginx 제한으로 특정해 관리자와 해결했습니다. 종합 우수 조로 선정되었습니다."
                href: "https://github.com/Step3-kakao-tech-campus/Team14_BE"
                image:
                  src: "/static/home/kakao-tech-campus-2023.jpg"
                  alt: "전남대학교 코스모스홀 무대에서 축팅 앱 화면을 띄우고 마이크로 발표하는 고범수"
                  caption: "카카오 테크 캠퍼스 최종 발표"
                  width: 1200
                  height: 900
              - period: "2024.09 – 2026.01"
                title: "MSc Advanced Computer Science — Distinction"
                org: "University of Sheffield"
                body: "뒤엉킨 코드 커밋 연구를 제1저자로 진행했습니다. International PGT Merit Scholarship을 받았고, Net Zero Data Challenge 2025에서 Most Impactful Solution으로 선정되었습니다."
                href: "#research"
                image:
                  src: "/static/home/net-zero-data-challenge-2025.jpg"
                  alt: "Beomsu Koh 이름이 적힌 Net Zero Data Challenge Most Impactful Solution 인증서"
                  caption: "Net Zero Data Challenge 2025 — Most Impactful Solution 인증서"
                  width: 1200
                  height: 709
              - period: "2024.09 – 현재"
                title: "Obsidian 공식 커뮤니티 플러그인 — Author & Maintainer"
                org: "오픈소스"
                href: "#open-source"
                body: "대표 플러그인은 LLM으로 노트 메타데이터를 분류하는 Metadata Auto Classifier와 로컬 우선 RAG인 Open Connections입니다. 공식 커뮤니티 플러그인 7개를 관리합니다."
              - period: "2026.03 – 2026.09"
                title: "Upstage AI Ambassador 2기\u00A0·\u00A02.5기 — 우수 앰배서더"
                org: "Upstage"
                body: "2026년 5월 우수 앰배서더로 선정되었습니다. 전남대 × Upstage Skillthon을 직접 제안해 개최했으며, 47명 13팀이 참가했습니다."
                image:
                  src: "/static/home/upstage-ambassador-2026.jpg"
                  alt: "Upstage AI Education Thanks Dinner 화면 앞에서 Upstage AI Ambassador와 교육팀이 함께 찍은 단체 사진"
                  caption: "Upstage AI Ambassador 2기 해단식"
                  width: 1200
                  height: 900
              - period: "2026.06 – 2026.10"
                title: "SeeON — Co-founder, CTO"
                org: "Senior AI Lab"
                href: "#work"
                body: "데이터셋, 학습, 서버, 관제, 배포까지 낙상 감지 시스템의 개발 전 영역을 혼자 맡았습니다."
              - period: "2026.06 – 2026.08"
                title: "KREN AI Ops — Freelance AI Engineer"
                org: "고객사 KREN"
                href: "#work"
                body: "KREN의 GitOps 네트워크 운영에 에이전트를 도입한 AX 프로젝트로, 설계와 구현을 혼자 맡았습니다."
              - period: "2026.07 – 현재"
                title: "OSS Hub — PM, Backend Engineer"
                org: "전남대학교 SW중심대학사업단"
                href: "https://jnu-oss-hub.com/"
                body: "학생 개발자 3명과 2주 만에 첫 운영 배포를 마쳤고, 4개월째 운영하고 있습니다."
            facts:
              - term: "2026.05"
                detail: "Upstage 우수 앰배서더"
                href: "https://www.linkedin.com/feed/update/urn:li:activity:7468929582113431552/"
              - term: "2025.09"
                detail: "Net Zero Data Challenge 2025 — Most Impactful Solution"
                href: "https://www.linkedin.com/feed/update/urn:li:activity:7376614848605913088/"
              - term: "2024.06"
                detail: "Sheffield International PGT Merit Scholarship (£5,000)"
              - term: "2023.11"
                detail: "카카오 테크 캠퍼스 1기 종합 우수 조"
              - term: "2022.12"
                detail: "2022 K-디지털 챌린지 : NET 챌린지 캠프 시즌9 은상 (KOREN 협력기관상)"
          - id: work
            nav: "작업"
            kicker: "Work"
            title: "현장에서 돌아가게 만든 것"
            lede: "제품과 Freelance 프로젝트 모두 구현에서 멈추지 않고, 실제 환경에서 운영되는지까지 확인합니다."
            groups:
              - label: "제품"
                cards:
                  - title: "SeeON"
                    body: "요양 시설 카메라 영상으로 낙상을 실시간 감지하는 시스템입니다. 디코딩, 자세 추정, 추적을 DeepStream 파이프라인 하나로 묶었습니다. RTX 5070 Ti 한 장으로 실제 카메라 13대를 대당 29.97fps, 합계 389.6fps로 처리했습니다. RTSP 허브로 CCTV 벤더 종속을 없애고 프레임당 CPU 복사량을 98% 줄였으며, 카메라별 장애 격리와 CUDA 초기화 실패 시 시작 중단(fail-fast)을 적용했습니다."
                    meta: "Senior AI Lab · 2026.06 – 2026.10"
                  - title: "OSS Hub"
                    body: "전남대 학생의 오픈소스 기여를 학생 계정 기준으로 모아 보여 주는 플랫폼입니다. 에이전트가 티켓별 구현과 1차 리뷰를, 사람이 요구사항과 merge 판단을 맡는 방식으로 학생 개발자 3명과 2주 만에 첫 운영 배포를 마쳤습니다. Lighthouse 모바일 기준 랭킹 화면 LCP를 83% 줄였고, push 전과 CI에서 API 계약과 아키텍처 규칙을 강제해 데이터가 10배로 늘어도 21개 경로의 쿼리 수가 변하지 않습니다."
                    href: "https://jnu-oss-hub.com/"
                    meta: "전남대학교 SW중심대학사업단 · 2026.07 – 현재"
              - label: "Freelance"
                cards:
                  - title: "KREN AI Ops"
                    body: "KREN의 GitOps 네트워크 운영에 에이전트를 도입한 시스템입니다. Codex에서 요청하면 조율 에이전트 Falcon이 역할별 워커 11개 중 담당자에게 배정하고, 배정 후 25–46초 안에 처리합니다. MCP 테스트 138개를 통과했습니다. Hermes Agent를 채택하고 기존 Codex 구독과 MCP를 연동해 추가 API 비용 없이 도입했으며, AX 교육 후 운영팀에 인수인계했습니다."
                    meta: "KREN · SICHIMI AI Ops · 2026.06 – 2026.08"
          - id: open-source
            nav: "오픈소스"
            kicker: "Open source"
            title: "공개하고 관리하는 도구"
            lede: "Obsidian 공식 커뮤니티 플러그인 7개와 MCP 서버, CLI, 에이전트 스킬을 공개해 직접 관리합니다. npm 다운로드 수는 2026년 11월 25일 기준 누적입니다."
            groups:
              - label: "Obsidian plugins"
                cards:
                  - title: "Metadata Auto Classifier"
                    body: "LLM으로 노트의 메타데이터를 자동 분류합니다. 하나의 프로바이더 계층으로 10개 LLM 프리셋을 지원하고, 고정 프롬프트를 앞에 두어 prompt caching을 적용했습니다. Technology Hits의 플러그인 리뷰 기사에 소개되었습니다."
                    href: "https://github.com/GoBeromsu/obsidian-metadata-auto-classifier"
                    meta: "★ 59 · ↓ 8,912 · 2024.09 –"
                  - title: "Open Connections"
                    body: "로컬 우선 RAG 플러그인입니다. 헤딩 단위 청킹과 벡터 검색을 제공하고, MCP 서버로 인덱스를 다른 에이전트에 엽니다. 노트 1만 3천 개 볼트의 OOM을 색인 메모리 최적화로 해소했습니다."
                    href: "https://github.com/GoBeromsu/obsidian-open-connections"
                    meta: "★ 23 · ↓ 5,031 · 2026.02 –"
                  - title: "Eagle Integration"
                    body: "붙여 넣은 이미지를 Eagle 라이브러리에 올리고 로컬 캐시로 렌더링합니다."
                    href: "https://github.com/GoBeromsu/obsidian-eagle"
                    meta: "★ 11 · ↓ 3,740 · 2025.07 –"
                  - title: "Note Player"
                    body: "노트를 플레이리스트로 삼아 YouTube·캐시 오디오·로컬 파일을 재생합니다."
                    href: "https://github.com/GoBeromsu/obsidian-note-player"
                    meta: "★ 2 · ↓ 525 · 2026.03 –"
                  - title: "QMD Search"
                    body: "BM25, 벡터, HyDE를 결합한 로컬 하이브리드 검색과 관련 노트 보기, 자동 동기화를 제공합니다."
                    href: "https://github.com/GoBeromsu/obsidian-qmd"
                    meta: "★ 3 · ↓ 786 · 2026.03 –"
                  - title: "Hermes Control Center"
                    body: "SSH로 원격 Hermes 에이전트 프로필의 칸반·스킬·크론·채팅을 관리합니다."
                    href: "https://github.com/GoBeromsu/obsidian-hermes"
                    meta: "★ 1 · ↓ 125 · 2026.09 –"
                  - title: "Multilingual Bible Search"
                    body: "한·영 성경 구절을 검색해 템플릿으로 삽입합니다."
                    href: "https://github.com/GoBeromsu/obsidian-bible-search"
                    meta: "↓ 34 · 2026.03 –"
              - label: "MCP · CLI"
