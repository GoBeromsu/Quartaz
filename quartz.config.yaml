# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: Beomsu Koh
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: google
    tagId: G-P07C416MPF
  locale: ko-KR
  baseUrl: beomsukoh.com
  multilingual:
    enabled: true
    sourceLocale: ko
    targetLocales:
      - en
    locales:
      - id: ko
        locale: ko-KR
        routePrefix: /ko/
        direction: ltr
        label: Korean
        nativeName: 한국어
      - id: en
        locale: en-US
        routePrefix: /en/
        direction: ltr
        label: English
        nativeName: English
    localizedSlug: false
    defaultLocaleRoute: /ko/
    xDefaultRoute: /
    legacyRedirects:
      flatPermalinks: true
      status: 301
      noindex: true
    contentIndex:
      search: all
      rss: source
      sitemap: all
  ignorePatterns:
    - .git
    - .gitignore
    - .obsidian
    - "**/*.pdf"
    - "**/*.canvas"
    - "**/private/*"
    - .smart-env
    - 50. Calendar
    - 70. Settings
    - zh-Hans/**
    - hi/**
    - es/**
    - fr/**
    - ar/**
    - bn/**
    - pt-BR/**
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Inter
      body: Inter
      code: IBM Plex Mono
    colors:
      lightMode:
        light: "#ffffff"
        lightgray: "#e6e6e6"
        gray: "#737373"
        darkgray: "#0f0f0f"
        dark: "#0f0f0f"
        secondary: "#a52142"
        tertiary: "#c75b75"
        highlight: "rgba(165, 33, 66, 0.08)"
        textHighlight: "#fff23688"
      darkMode:
        light: "#262626"
        lightgray: "#353535"
        gray: "#8c8c8c"
        darkgray: "#d1d1d1"
        dark: "#d1d1d1"
        secondary: "#c75b75"
        tertiary: "#a52142"
        highlight: "rgba(165, 33, 66, 0.12)"
        textHighlight: "#b3aa0288"
plugins:
  - source: ./plugins/legacy-frontmatter-dates
    enabled: true
    order: 5
  - source: github:quartz-community/note-properties
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: false
      delimiters: "---"
      language: yaml
    order: 6
  - source: github:quartz-community/created-modified-date
    enabled: true
    options:
      defaultDateType: created
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: github:quartz-community/syntax-highlighting
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: github:quartz-community/obsidian-flavored-markdown
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30
  - source: github:quartz-community/github-flavored-markdown
    enabled: true
    order: 40
  - source: github:quartz-community/table-of-contents
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
      condition: has-toc
      display: desktop-only
  - source: github:quartz-community/crawl-links
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: github:quartz-community/description
    enabled: true
    order: 70
  - source: github:quartz-community/latex
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: github:quartz-community/remove-draft
    enabled: true
  - source: github:quartz-community/unlisted-pages
    enabled: true
  - source: github:quartz-community/alias-redirects
    enabled: true
  - source: ./plugins/multilingual-content-index
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: ./plugins/graph-landing
    enabled: true
  - source: ./plugins/blog-chrome
    enabled: true
  - source: ./plugins/blog-home
    enabled: true
  - source: github:quartz-community/favicon
    enabled: true
  - source: github:quartz-community/og-image
    enabled: true
  - source: github:quartz-community/cname
    enabled: true
  - source: github:quartz-community/content-page
    enabled: true
  - source: github:quartz-community/folder-page
    enabled: true
  - source: github:quartz-community/tag-page
    enabled: true
  - source: github:quartz-community/page-title
    enabled: true
  - source: github:quartz-community/search
    enabled: true
  - source: github:quartz-community/darkmode
    enabled: true
  - source: github:quartz-community/breadcrumbs
    enabled: true
  - source: github:quartz-community/article-title
    enabled: true
  - source: github:quartz-community/content-meta
    enabled: true
  - source: github:quartz-community/tag-list
    enabled: true
  - source: github:quartz-community/comments
    enabled: true
layout:
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content:
      template: full-width
      positions:
        left: []
    folder:
      template: full-width
      positions:
        left: []
        right: []
    tag:
      template: full-width
      positions:
        left: []
        right: []
    graph:
      template: minimal
      positions:
        left: []
        right: []
        beforeBody: []
