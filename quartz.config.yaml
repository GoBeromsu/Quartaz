                    body: "Team project 축팅, a service that connects people through four-cut photo booth photos; deployed its Spring, Redis and MariaDB backend to Kakao's internal Kubernetes with Kargo. Photo uploads over 1 MB failed with 413, and fixing the Ingress and ConfigMap did not help. I reproduced it myself, showing the Pod logs had no 413 and the same Nginx image passed locally, which proved the platform's front Nginx was the cause; the reproduction persuaded the platform admins and it was fixed. The team was named best overall team (grand prize)."
                    href: "https://berom.tistory.com/546"
                    image:
                      src: "/static/home/kakao-tech-campus-2023.jpg"
                      alt: "Beomsu Koh presenting the team project with a microphone on stage at Chonnam National University's Cosmos Hall"
                      caption: "Kakao Tech Campus final presentation"
                      width: 1200
                      height: 900
                  - period: "2022.05 – 2022.12"
                    title: "오케스트라이브 — Team Lead"
                    org: "K-Digital Challenge: 2022 NET Challenge Camp Season 9 · team of four"
                    body: "A WebRTC service that makes online ensemble playing possible despite audio latency, with signalling and media servers deployed on KOREN 5G MEC. Ensemble playing needs both lower latency and synchronised performance, so I built Coturn STUN and TURN servers and designed MCU plus SFU with RTP/NTP-based synchronisation. Connected nearby users for real-time ensemble playing, demoed it at ETRI, and won the silver prize (KOREN partner-institution prize)."
                  - period: "2022.03 – 2024.06"
                    title: "Undergraduate Researcher, RA"
                    org: "Advanced Network Lab, Chonnam National University"
                    body: "Built Wi-Fi 6 roaming for the 5G Open Test Lab, field-tested it with ETRI and demoed 5G MEC. When the nationwide university Wi-Fi roaming authentication server moved from the Chonnam computing centre to KREN with fewer operations staff, I split test and production deployment by PR label, redeployed through Jenkins when authentication logs stopped and fixed missing Loki alerts, so deployment and incident response no longer needed a server login."
                  - period: "2018.03 – 2024.08"
                    title: "BSc in Software Engineering"
                    org: "Chonnam National University"
                    body: "Bachelor's degree in software engineering. During it I worked as an undergraduate researcher and RA at the Advanced Network Lab, was a TA for data communication and computer networks, and took part in NET Challenge Camp Season 9 and Kakao Tech Campus 1st cohort."
