          - id: open-source
            nav: "오픈소스"
            kicker: "Open source"
            title: "공개하고 관리하는 도구"
            lede: "Obsidian 공식 커뮤니티 플러그인 7개, MCP 서버, CLI, 에이전트 스킬을 공개해 직접 관리합니다. npm 다운로드 수는 2026년 11월 25일 기준 누적입니다. 아래 목록은 그 밖의 공개 저장소 중 일부이며, 전체는 GitHub에 있습니다."
            groups:
              - label: "Obsidian plugins"
                cards:
                  - title: "Metadata Auto Classifier"
                    body: "노트 컨벤션에 맞는 태그와 frontmatter를 LLM으로 분류합니다. 노트마다 볼트의 기존 값 중 맞는 것을 판정해 확신한 값만 기록합니다."
                    href: "https://github.com/GoBeromsu/obsidian-metadata-auto-classifier"
                    meta: "★ 59 · ↓ 8,912 · 2024.09 –"
                  - title: "Open Connections"
                    body: "1만 3천 노트 볼트의 embedding 색인이 메모리를 초과하자, 내장 SQLite로 파일에 저장하고 벡터를 4 byte로 줄여 메모리 누적을 막았습니다."
                    href: "https://github.com/GoBeromsu/obsidian-open-connections"
                    meta: "★ 23 · ↓ 5,031 · 2026.02 –"
                  - title: "Eagle Integration"
                    body: "붙여 넣은 이미지를 Eagle 라이브러리에 올리고 로컬 캐시로 렌더링합니다."
