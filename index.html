<!DOCTYPE html>
<html lang="ko">
<head>
<title>Choose language</title>
<link rel="canonical" href="https://beomsukoh.com/">
<link rel="alternate" hreflang="x-default" href="https://beomsukoh.com/">
<link rel="alternate" hreflang="ko-KR" href="https://beomsukoh.com/ko/">
<link rel="alternate" hreflang="en-US" href="https://beomsukoh.com/en/">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>(function () {
  var locales = [{"id":"ko","prefix":"/ko/","tags":["ko","ko-KR"]},{"id":"en","prefix":"/en/","tags":["en","en-US"]}];
  var sourceLocale = "ko";
  var storageKey = "preferred-locale";
  function normalize(value) {
    return String(value || "").toLowerCase();
  }
  function findById(id) {
    for (var i = 0; i < locales.length; i++) {
      if (locales[i].id === id) return locales[i];
    }
  }
  function matchLanguage(language) {
    var lang = normalize(language);
    if (!lang) return;
    for (var i = 0; i < locales.length; i++) {
      var locale = locales[i];
      var id = normalize(locale.id);
      if (lang === id || lang.indexOf(id + "-") === 0) return locale;
      for (var j = 0; j < locale.tags.length; j++) {
        var tag = normalize(locale.tags[j]);
        if (lang === tag || lang.indexOf(tag + "-") === 0) return locale;
        var primary = tag.split("-")[0];
        if (primary && (lang === primary || lang.indexOf(primary + "-") === 0)) return locale;
      }
    }
  }
  var chosen;
  try {
    chosen = findById(localStorage.getItem(storageKey));
  } catch (error) {}
  if (!chosen) {
    var languages = [];
    try {
      languages = navigator.languages ? Array.prototype.slice.call(navigator.languages) : [];
    } catch (error) {}
    if (!languages.length) {
      try {
        if (navigator.language) languages = [navigator.language];
      } catch (error) {}
    }
    for (var i = 0; i < languages.length && !chosen; i++) {
      chosen = matchLanguage(languages[i]);
    }
  }
  if (!chosen) chosen = findById(sourceLocale);
  if (chosen) location.replace(chosen.prefix);
})();</script>
</head>
<body>
<main>
<h1>Choose language</h1>
<ul>
<li><a href="/ko/" lang="ko-KR" hreflang="ko-KR">한국어</a></li>
<li><a href="/en/" lang="en-US" hreflang="en-US">English</a></li>
</ul>
</main>
</body>
</html>
